[platformio]
default_envs = node_a

[env]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200

; deep+ потрібен, бо модулі в lib/ посилаються один на одного,
; а типовий аналізатор залежностей дивиться лише на src/
lib_ldf_mode = deep+

build_flags = -I include

; ---------------------------------------------------------------------------
; Робочі прошивки. Обидві плати отримують ОДНАКОВИЙ код,
; відрізняються лише ідентифікаторами та наявністю клавіатури.
; ---------------------------------------------------------------------------

; node_a — перша плата
[env:node_a]
lib_deps =
    jgromes/RadioLib
    olikraus/U8g2
build_flags =
    ${env.build_flags}
    -D NODE_ID=1
    -D PEER_ID=2
    -D HAS_KEYPAD=1
    -D TEST_AUTOSEND=0
build_src_filter = +<*> -<keypad_test.cpp> -<buzzer_test.cpp> -<vibro_test.cpp>

; node_b — друга плата, повністю ідентична першій
[env:node_b]
lib_deps =
    jgromes/RadioLib
    olikraus/U8g2
build_flags =
    ${env.build_flags}
    -D NODE_ID=2
    -D PEER_ID=1
    -D HAS_KEYPAD=1
    -D TEST_AUTOSEND=0
build_src_filter = +<*> -<keypad_test.cpp> -<buzzer_test.cpp> -<vibro_test.cpp>

; ---------------------------------------------------------------------------
; Діагностика заліза. lib_deps тут навмисно немає: RadioLib і U8g2
; тестам не потрібні, а їх присутність лише ламає збірку.
; ---------------------------------------------------------------------------

; lib_ignore потрібен додатково до відсутності lib_deps: аналізатор
; залежностей у режимі deep+ переглядає всі модулі в lib/, а link
; тягне за собою RadioLib. Явна заборона надійніша за здогадки LDF.

[env:keytest]
lib_ignore = link, ui, power, history, input, periph, RadioLib, U8g2
build_flags =
    ${env.build_flags}
    -D HAS_KEYPAD=1
build_src_filter = -<*> +<keypad_test.cpp>

[env:buzztest]
lib_ignore = link, ui, power, keypad, history, input, periph, RadioLib, U8g2
build_flags = ${env.build_flags}
build_src_filter = -<*> +<buzzer_test.cpp>

[env:vibrotest]
lib_ignore = link, ui, power, keypad, history, input, periph, RadioLib, U8g2
build_flags = ${env.build_flags}
build_src_filter = -<*> +<vibro_test.cpp>